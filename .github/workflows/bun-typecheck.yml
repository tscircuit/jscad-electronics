# Created using @tscircuit/plop (npm install -g @tscircuit/plop)
name: Type Check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  type-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun i

      - name: Run type check
        run: bun run typecheck

      - name: Diagnose extrusion coordinate welding
        run: |
          cat > .extrusion-probe.ts <<'TS'
          import jscad from "@jscad/modeling"
          import { createRectangularTubeModel } from "./lib/models/rectangulartube/model"
          const { geometries, modifiers, measurements } = jscad
          const cases=[
            {name:"routing",width:40,height:20,wallThickness:2,length:60,outerRadius:4,innerRadius:2},
            {name:"drawing",width:40,height:20,wallThickness:3,length:80,outerRadius:3,innerRadius:1},
            {name:"extreme",width:100000,height:20,wallThickness:2,length:80,outerRadius:9.9999,innerRadius:4},
            {name:"small",width:2,height:1,wallThickness:0.1,length:5,outerRadius:0.2,innerRadius:0.1},
          ]
          for(const {name,...parameters} of cases) {
           const solid=createRectangularTubeModel(parameters).geometries[0]
           const extent=Math.max(...measurements.measureDimensions(solid))
           for(const mode of ["fixed","relative"]) {
            const epsilon=mode==="fixed"?1e-9:Math.max(extent*1e-10,1e-12)
            const rounded=geometries.geom3.fromPoints(
             geometries.geom3.toPolygons(solid).map(p=>p.vertices.map(v=>
              v.map(x=>mode==="fixed"?Math.round(x*1e9)/1e9:Math.round(x/epsilon)*epsilon))))
            try {
             const repaired=modifiers.generalize({snap:false,triangulate:true},rounded)
             geometries.geom3.validate(repaired)
             console.log(JSON.stringify({name,mode,epsilon,valid:true,volume:measurements.measureVolume(repaired),originalVolume:measurements.measureVolume(solid),polygons:repaired.polygons.length}))
            } catch(error) { console.log(JSON.stringify({name,mode,epsilon,valid:false,error:String(error).split("\n")[0]})) }
           }
          }
          
          TS
          bun .extrusion-probe.ts
