name: Generate generic adapter model review snapshots
on:
  push:
    branches: [codex/review-generic-adapter-meshes-20261006]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install
      - run: bun test tests/snapshots/adapter-cables.test.ts --timeout 30000
        env:
          BUN_UPDATE_SNAPSHOTS: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: generic-adapter-model-review
          path: tests/snapshots/__snapshots__/adapter-cables-*.snap.png
          if-no-files-found: error
