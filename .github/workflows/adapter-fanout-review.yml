name: Review localized adapter fanout snapshots
on:
  push:
    branches: [codex/review-localized-adapter-fanout-20261007]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install
      - run: bun test tests/adapter-cable-meshes.test.ts tests/snapshots/adapter-cables.test.ts --timeout 30000
        env:
          BUN_UPDATE_SNAPSHOTS: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: localized-adapter-fanout
          path: tests/snapshots/__snapshots__/adapter-cables-*.snap.png
          if-no-files-found: error
