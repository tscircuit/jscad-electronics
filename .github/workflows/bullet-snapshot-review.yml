name: Generate bullet connector review snapshots
on:
  push:
    branches: [codex/review-bullet-four-views-20261006]
permissions:
  contents: read
jobs:
  snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun test tests/snapshots/bullet-connectors.test.ts
        env:
          BUN_UPDATE_SNAPSHOTS: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: bullet-four-view-snapshots
          path: tests/snapshots/__snapshots__/bullet-connectors-*.snap.png
          if-no-files-found: error
